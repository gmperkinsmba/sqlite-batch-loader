name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and verify Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          expected=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          temp_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$temp_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
            --output "$temp_dir/$archive"
          printf '%s  %s\n' "$expected" "$archive" \
            | (cd "$temp_dir" && sha256sum --check --status)
          tar -xzf "$temp_dir/$archive" -C "$temp_dir" gitleaks
          chmod 755 "$temp_dir/gitleaks"
          "$temp_dir/gitleaks" version | grep -Fx '8.30.1'

      - name: Scan repository history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .

      - name: Check installer boundaries
        run: |
          set -euo pipefail
          test_dir=tests
          if [ ! -d "$test_dir" ] && [ -d Tests ]; then test_dir=Tests; fi
          python3 -m unittest discover -s "$test_dir" -p 'test_install_security.py' -v
          if [ -f "$test_dir/test_installer_integration.py" ]; then
            python3 -m unittest discover -s "$test_dir" -p 'test_installer_integration.py' -v
          fi
          if [ -f "$test_dir/test_runtime_security.py" ]; then
            python3 -m unittest discover -s "$test_dir" -p 'test_runtime_security.py' -v
          fi
